
service: armada # NOTE: update this with your service name
#app: your-app-name
#tenant: your-tenant-name

custom:
  version: v1
  users:
    handler: handlers/usersHandler
    path: ${self:custom.version}/users
  martialArts:
    handler: handlers/martialArtsHandler
    path: ${self:custom.version}/martialArts
  academies:
    handler: handlers/academiesHandler
    path: ${self:custom.version}/academies

provider:
  name: aws
  runtime: nodejs10.x

functions:
  createUser:
    handler: ${self:custom.users.handler}.createEntity
    events:
      - http:
          path: ${self:custom.users.path}
          method: post
  updateUser:
    handler: ${self:custom.users.handler}.updateEntity
    events:
      - http:
          path: ${self:custom.users.path}/{id}
          method: put
          request:
            parameters:
              paths:
                id: true
  getUser:
    handler: ${self:custom.users.handler}.getEntity
    events:
      - http:
          path: ${self:custom.users.path}/{id}
          method: get
          request:
            parameters:
              paths:
                id: true
  listUsers:
    handler: ${self:custom.users.handler}.listEntities
    events:
      - http:
          path: ${self:custom.users.path}
          method: get
  deleteUser:
    handler: ${self:custom.users.handler}.deleteEntity
    events:
      - http:
          path: ${self:custom.users.path}/{id}
          method: delete
          request:
            parameters:
              paths:
                id: true
  createMartialArts:
    handler: ${self:custom.martialArts.handler}.createEntity
    events:
      - http:
          path: ${self:custom.martialArts.path}
          method: post
  updateMartialArts:
    handler: ${self:custom.martialArts.handler}.updateEntity
    events:
      - http:
          path: ${self:custom.martialArts.path}/{id}
          method: put
          request:
            parameters:
              paths:
                id: true
  getMartialArts:
    handler: ${self:custom.martialArts.handler}.getEntity
    events:
      - http:
          path: ${self:custom.martialArts.path}/{id}
          method: get
          request:
            parameters:
              paths:
                id: true
  listMartialArts:
    handler: ${self:custom.martialArts.handler}.listEntities
    events:
      - http:
          path: ${self:custom.martialArts.path}
          method: get
  deleteMartialArts:
    handler: ${self:custom.martialArts.handler}.deleteEntity
    events:
      - http:
          path: ${self:custom.martialArts.path}/{id}
          method: delete
          request:
            parameters:
              paths:
                id: true
  createSchools:
    handler: handlers/schoolsHandler.createEntity
    events:
      - http:
          path: schools
          method: post
  updateSchools:
    handler: handlers/schoolsHandler.updateEntity
    events:
      - http:
          path: schools/{id}
          method: put
          request:
            parameters:
              paths:
                id: true
  getSchools:
    handler: handlers/schoolsHandler.getEntity
    events:
      - http:
          path: schools/{id}
          method: get
          request:
            parameters:
              paths:
                id: true
  listSchools:
    handler: handlers/schoolsHandler.listEntities
    events:
      - http:
          path: schools
          method: get
  deleteSchools:
    handler: handlers/schoolsHandler.deleteEntity
    events:
      - http:
          path: schools/{id}
          method: delete
          request:
            parameters:
              paths:
                id: true
  createClasses:
    handler: handlers/classesHandler.createEntity
    events:
      - http:
          path: classes
          method: post
  updateClasses:
    handler: handlers/classesHandler.updateEntity
    events:
      - http:
          path: classes/{id}
          method: put
          request:
            parameters:
              paths:
                id: true
  getClasses:
    handler: handlers/classesHandler.getEntity
    events:
      - http:
          path: classes/{id}
          method: get
          request:
            parameters:
              paths:
                id: true
  listClasses:
    handler: handlers/classesHandler.listEntities
    events:
      - http:
          path: classes
          method: get
  deleteClasses:
    handler: handlers/classesHandler.deleteEntity
    events:
      - http:
          path: classes/{id}
          method: delete
          request:
            parameters:
              paths:
                id: true
  createAcademies:
    handler: ${self:custom.academies.handler}.createEntity
    events:
      - http:
          path: ${self:custom.academies.path}
          method: post
  updateAcademies:
    handler: ${self:custom.academies.handler}.updateEntity
    events:
      - http:
          path: ${self:custom.academies.path}/{id}
          method: put
          request:
            parameters:
              paths:
                id: true
  getAcademies:
    handler: ${self:custom.academies.handler}.getEntity
    events:
      - http:
          path: ${self:custom.academies.path}/{id}
          method: get
          request:
            parameters:
              paths:
                id: true
  listAcademies:
    handler: ${self:custom.academies.handler}.listEntities
    events:
      - http:
          path: ${self:custom.academies.path}
          method: get
  deleteAcademies:
    handler: ${self:custom.academies.handler}.deleteEntity
    events:
      - http:
          path: ${self:custom.academies.path}/{id}
          method: delete
