
service: armada-academy # NOTE: update this with your service name
#app: your-app-name
#tenant: your-tenant-name

custom:
  version: v1
  users:
  academies:
    handler: src/handlers/academiesHandler
    path: ${self:custom.version}/academies
  locations:
    handler: src/handlers/locationsHandler
    path: ${self:custom.version}/locations
  scheduleItems:
    handler: src/handlers/scheduleItemsHandler
    path: ${self:custom.version}/scheduleItems
  classes:
    handler: src/handlers/classesHandler
    path: ${self:custom.version}/classes
  academyRequests:
    handler: src/handlers/academyRequestsHandler
    path: ${self:custom.version}/academyRequests
  notifications:
    handler: src/handlers/notificationsHandler
    path: ${self:custom.version}/notifications
  cors:
    origins:
      - 'https://7h3t72u9r0.execute-api.us-east-1.amazonaws.com*'
      - 'http://localhost*'
    headers:
      - Content-Type
      - X-Amz-Date
      - Authorization
      - X-Api-Key
      - X-Amz-Security-Token
      - X-Amz-User-Agent
      - X-Amz-User-Agent
      - Access-Control-Allow-Origin
      - X-Xsrf-Token
      - Api-Key
      - Cookie
    allowCredentials: true

provider:
  name: aws
  runtime: nodejs10.x
  environment: ${file(./serverless.env.yml):${opt:stage, 'dev'}}
  role: arn:aws:iam::302314551855:role/Armada

functions:
  uploadAcademyImage:
    handler: ${self:custom.academies.handler}.uploadImage
    events:
      - http:
          path: ${self:custom.academies.path}/{id}/{type}
          method: post
  createAcademies:
    handler: ${self:custom.academies.handler}.create
    events:
      - http:
          path: ${self:custom.academies.path}
          method: post
  updateAcademies:
    handler: ${self:custom.academies.handler}.update
    events:
      - http:
          path: ${self:custom.academies.path}/{id}
          method: put
          request:
            parameters:
              paths:
                id: true
  getAcademies:
    handler: ${self:custom.academies.handler}.get
    events:
      - http:
          path: ${self:custom.academies.path}/{id}
          method: get
          request:
            parameters:
              paths:
                id: true
  listAcademies:
    handler: ${self:custom.academies.handler}.list
    events:
      - http:
          path: ${self:custom.academies.path}
          method: get
  deleteAcademies:
    handler: ${self:custom.academies.handler}.delete
    events:
      - http:
          path: ${self:custom.academies.path}/{id}
          method: delete
          request:
            parameters:
              paths:
                id: true
  getUserAcademies:
    handler: ${self:custom.academies.handler}.getUserAcademies
    events:
      - http:
          path: ${self:custom.academies.path}/byUser/{id}
          method: get
          request:
            parameters:
              paths:
                id: true
  cancelAcademyMembership:
    handler: ${self:custom.academies.handler}.cancelMembership
    events:
      - http:
          path: ${self:custom.academies.path}/cancel/{id}
          method: patch
          request:
            parameters:
              paths:
                id: true
  createLocations:
    handler: ${self:custom.locations.handler}.create
    events:
      - http:
          path: ${self:custom.locations.path}
          method: post
  updateLocations:
    handler: ${self:custom.locations.handler}.update
    events:
      - http:
          path: ${self:custom.locations.path}/{id}
          method: put
          request:
            parameters:
              paths:
                id: true
  getLocations:
    handler: ${self:custom.locations.handler}.get
    events:
      - http:
          path: ${self:custom.locations.path}/{id}
          method: get
          request:
            parameters:
              paths:
                id: true
  listLocations:
    handler: ${self:custom.locations.handler}.list
    events:
      - http:
          path: ${self:custom.locations.path}
          method: get
  deleteLocations:
    handler: ${self:custom.locations.handler}.delete
    events:
      - http:
          path: ${self:custom.locations.path}/{id}
          method: delete
          request:
            parameters:
              paths:
                id: true
  createClasses:
    handler: ${self:custom.classes.handler}.create
    events:
      - http:
          path: ${self:custom.classes.path}
          method: post
  attendClasses:
    handler: ${self:custom.classes.handler}.attend
    events:
      - http:
          path: ${self:custom.classes.path}/attend
          method: patch
  unattendClasses:
    handler: ${self:custom.classes.handler}.unattend
    events:
      - http:
          path: ${self:custom.classes.path}/unattend
          method: patch
  updateClasses:
    handler: ${self:custom.classes.handler}.update
    events:
      - http:
          path: ${self:custom.classes.path}/{id}
          method: put
          request:
            parameters:
              paths:
                id: true
  getClasses:
    handler: ${self:custom.classes.handler}.get
    events:
      - http:
          path: ${self:custom.classes.path}/{id}
          method: get
          request:
            parameters:
              paths:
                id: true
  listClasses:
    handler: ${self:custom.classes.handler}.list
    events:
      - http:
          path: ${self:custom.classes.path}
          method: get
  deleteClasses:
    handler: ${self:custom.classes.handler}.delete
    events:
      - http:
          path: ${self:custom.classes.path}/{id}
          method: delete
          request:
            parameters:
              paths:
                id: true
  createAcademyRequests:
    handler: ${self:custom.academyRequests.handler}.create
    events:
      - http:
          path: ${self:custom.academyRequests.path}
