
service: armada # NOTE: update this with your service name
#app: your-app-name
#tenant: your-tenant-name

custom:
  version: v1
  users:
    handler: src/handlers/usersHandler
    path: ${self:custom.version}/users
  martialArts:
    handler: src/handlers/martialArtsHandler
    path: ${self:custom.version}/martialArts
  academies:
    handler: src/handlers/academiesHandler
    path: ${self:custom.version}/academies
  locations:
    handler: src/handlers/locationsHandler
    path: ${self:custom.version}/locations
  scheduleItems:
    handler: src/handlers/scheduleItemsHandler
    path: ${self:custom.version}/scheduleItems
  classes:
    handler: src/handlers/classesHandler
    path: ${self:custom.version}/classes
  cors:
    origins:
      - 'http://localhost*'
    headers:
      - Content-Type
      - X-Amz-Date
      - Authorization
      - X-Api-Key
      - X-Amz-Security-Token
      - X-Amz-User-Agent
      - X-Amz-User-Agent
      - Access-Control-Allow-Origin
      - X-Xsrf-Token
      - Api-Key
      - Cookie
    allowCredentials: true

provider:
  name: aws
  runtime: nodejs10.x
  environment: ${file(./serverless.env.yml):${opt:stage, 'dev'}}
  role: arn:aws:iam::302314551855:role/Armada

functions:
  uploadUserImage:
    handler: ${self:custom.users.handler}.uploadImage
    events:
      - http:
          path: ${self:custom.users.path}/{id}/{type}
          method: post
  register:
    handler: ${self:custom.users.handler}.register
    events:
      - http:
          path: ${self:custom.users.path}/register
          method: post
  forgotPassword:
    handler: ${self:custom.users.handler}.forgotPassword
    events:
      - http:
          path: ${self:custom.users.path}/forgotPassword
          method: post
  updatePassword:
    handler: ${self:custom.users.handler}.updatePassword
    events:
      - http:
          path: ${self:custom.users.path}/updatePassword/{id}
          method: patch
  login:
    handler: ${self:custom.users.handler}.login
    events:
      - http:
          path: ${self:custom.users.path}/login
          method: post
  logout:
    handler: ${self:custom.users.handler}.logout
    events:
      - http:
          path: ${self:custom.users.path}/logout
          method: get
  createUser:
    handler: ${self:custom.users.handler}.create
    events:
      - http:
          path: ${self:custom.users.path}
          method: post
  updateUser:
    handler: ${self:custom.users.handler}.update
    events:
      - http:
          path: ${self:custom.users.path}/{id}
          method: put
          request:
            parameters:
              paths:
                id: true
  getUser:
    handler: ${self:custom.users.handler}.get
    events:
      - http:
          path: ${self:custom.users.path}/{id}
          method: get
          request:
            parameters:
              paths:
                id: true
  listUsers:
    handler: ${self:custom.users.handler}.list
    events:
      - http:
          path: ${self:custom.users.path}
          method: get
  deleteUser:
    handler: ${self:custom.users.handler}.delete
    events:
      - http:
          path: ${self:custom.users.path}/{id}
          method: delete
          request:
            parameters:
              paths:
                id: true
  createMartialArts:
    handler: ${self:custom.martialArts.handler}.create
    events:
      - http:
          path: ${self:custom.martialArts.path}
          method: post
  updateMartialArts:
