    events:
      - http:
          path: ${self:custom.martialArts.path}/{id}
          method: get
          request:
            parameters:
              paths:
                id: true
  listMartialArts:
    handler: ${self:custom.martialArts.handler}.list
    events:
      - http:
          path: ${self:custom.martialArts.path}
          method: get
  deleteMartialArts:
    handler: ${self:custom.martialArts.handler}.delete
    events:
      - http:
          path: ${self:custom.martialArts.path}/{id}
          method: delete
          request:
            parameters:
              paths:
                id: true
  createSchools:
